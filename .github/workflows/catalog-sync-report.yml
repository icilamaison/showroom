# 카탈로그 동기화 1단계: 매일 dump + dry-run 리포트만.
# product.json은 CI에서 쓰지 않는다. 사람이 리포트를 보고 로컬/PR로 반영한다.
#
# 필요 Secrets
#   CAFE24_MALL_ID
#   CAFE24_CLIENT_ID
#   CAFE24_CLIENT_SECRET
#   CAFE24_REFRESH_TOKEN
#   CAFE24_SYNC_PAT          # repo secrets 쓰기 권한 있는 PAT (refresh_token 갱신 저장용)
#   CAFE24_REDIRECT_URI      # 선택 (auth/init 용, CI dump에는 불필요)
#
# 주의: skin31 등 같은 Cafe24 앱으로 로컬에서 refresh하면 Secret이 무효가 된다.
#       그때는 로컬에서:
#         npx tsx scripts/cafe24-auth.ts import /path/to/.cafe24-tokens.json
#       (CAFE24_SYNC_PAT 있으면 Secret까지 맞춤)
#   MAIL_USERNAME            # 발신 메일 (예: kimhi1105@icilamaison.com)
#   MAIL_PASSWORD            # Google 앱 비밀번호 (일반 비밀번호 X)
#   MAIL_SERVER              # 선택, 기본 smtp.gmail.com
#
# 완료 알림: kimhi1105@icilamaison.com
# 수동 실행: Actions → Catalog sync report → Run workflow

name: Catalog sync report

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 매출 리포트와 Cafe24 refresh_token 을 같이 쓴다. 동시에 돌리면 토큰이 죽는다.
  group: cafe24-admin-api
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Cafe24 .env.local
        # process.env에 CAFE24_REFRESH_TOKEN을 넣지 않는다.
        # 스크립트가 토큰을 갱신하면 .env.local만 바뀌고, 다음 단계는 그 파일을 읽어야 한다.
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
        run: |
          for key in CAFE24_MALL_ID CAFE24_CLIENT_ID CAFE24_CLIENT_SECRET CAFE24_REFRESH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key" >&2
              exit 1
            fi
          done
          {
            echo "CAFE24_MALL_ID=${CAFE24_MALL_ID}"
            echo "CAFE24_CLIENT_ID=${CAFE24_CLIENT_ID}"
            echo "CAFE24_CLIENT_SECRET=${CAFE24_CLIENT_SECRET}"
            echo "CAFE24_REFRESH_TOKEN=${CAFE24_REFRESH_TOKEN}"
          } > .env.local

      - name: Run catalog sync report (dry-run)
        env:
          # dump 중 토큰 갱신되면 스크립트가 Secret까지 맞춘다 (값 자체는 로그에 안 남김)
          CAFE24_SYNC_PAT: ${{ secrets.CAFE24_SYNC_PAT }}
        run: bash scripts/ci/catalog-sync-report.sh

      - name: Persist refreshed Cafe24 refresh_token
        id: persist_token
        if: always()
        env:
          CAFE24_SYNC_PAT: ${{ secrets.CAFE24_SYNC_PAT }}
        run: |
          if [ -z "${CAFE24_SYNC_PAT}" ]; then
            echo "CAFE24_SYNC_PAT이 없어 refresh_token을 Secrets에 저장하지 못했습니다." >&2
            {
              echo "## Token / Secret"
              echo
              echo "❌ CAFE24_SYNC_PAT 없음 — 다음 실행이 invalid_grant 날 수 있음"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          npx tsx scripts/cafe24-auth.ts push-secret
          {
            echo "## Token / Secret"
            echo
            echo "✅ CAFE24_REFRESH_TOKEN Secret 동기화 완료 (토큰 값은 로그에 없음)"
            npx tsx scripts/cafe24-auth.ts status || true
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-sync-report
          path: |
            artifacts/catalog-sync/
            cafe24-products.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check mail secrets
        id: mail
        if: always()
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MAIL_USERNAME/MAIL_PASSWORD 없음 — 메일 알림 스킵"
          fi

      - name: Build mail body
        id: mailbody
        if: always() && steps.mail.outputs.enabled == 'true'
        env:
          # sync 본문 성공 여부 (메일 실패와 분리). persist 실패도 반영.
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "subject=[showroom] catalog sync dry-run 완료" >> "$GITHUB_OUTPUT"
          else
            echo "subject=[showroom] catalog sync dry-run 실패" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "body<<MAIL_BODY_EOF"
            echo "Catalog sync dry-run: ${JOB_STATUS}"
            echo
            echo "실행 보기: ${RUN_URL}"
            echo
            if [ -f artifacts/catalog-sync/merge-dry-run.log ]; then
              echo "[merge]"
              grep -E '\(dry-run\)|\[신규 추가\]' artifacts/catalog-sync/merge-dry-run.log | tail -n 8 || true
              echo
            fi
            if [ -f artifacts/catalog-sync/stock-variants-dry-run.log ]; then
              echo "[stock]"
              grep -E '\(dry-run\)' artifacts/catalog-sync/stock-variants-dry-run.log | tail -n 3 || true
            fi
            echo "MAIL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # 메일 실패해도 catalog sync 성공을 Failure로 바꾸지 않는다.
      - name: Notify by email
        continue-on-error: true
        if: always() && steps.mail.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v4
        with:
          # Google Workspace / Gmail 기본값. 다른 SMTP면 MAIL_SERVER 시크릿으로 덮어쓴다.
          server_address: ${{ secrets.MAIL_SERVER != '' && secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.mailbody.outputs.subject }}
          to: kimhi1105@icilamaison.com
          from: Catalog Sync <${{ secrets.MAIL_USERNAME }}>
          body: ${{ steps.mailbody.outputs.body }}
